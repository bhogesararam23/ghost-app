name: Feature request
description: Suggest an improvement for Ghost Network
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to change?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What other approaches did you consider?

  - type: textarea
    id: security
    attributes:
      label: Privacy or security impact
      description: Could this change affect cryptography, identity, metadata or what the server can see?
